trigger: 
  name: none

pool:
  name: anooppool
steps:
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'anoopconnection'
    backendAzureRmOverrideSubscriptionID: 'e8d3e0f5-0b3e-4121-be0b-58a7e13e93e4'
    backendAzureRmResourceGroupName: 'anoopkarg'
    backendAzureRmStorageAccountName: 'anoopkasaacc'
    backendAzureRmContainerName: 'anoopcont'
    backendAzureRmKey: 'anoop.tfstate'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'anoopconnection'


- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    commandOptions: '--auto-aaprove'
    environmentServiceNameAzureRM: 'anoopconnection'